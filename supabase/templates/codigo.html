<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet" />
  </head>
  <body style="margin:0;padding:0;background:#F7F3EE">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0">Seu código: {{ .Token }}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F7F3EE">
      <tr>
        <td align="center" style="padding:32px 16px 28px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px">
            <tr>
              <td align="center" style="padding:4px 0 30px">
                <img src="https://agenda-facil-gabi.expo.app/logo-email-marrom.png" width="200" alt="Gabi Marqui Nail Designer" style="display:block;margin:0 auto;border:0;width:200px;max-width:200px;height:auto" />
              </td>
            </tr>
            <tr>
              <td style="padding:0 4px 10px;font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-size:32px;line-height:38px;font-weight:600;color:#2B2724">Confirme seu e-mail</td>
            </tr>
            <tr>
              <td style="padding:0 4px">
                <p style="margin:0 0 18px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:24px;color:#7A716A">
                  Digite este código na tela de agendamento para confirmar seu horário com a Gabi.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:6px 0 20px">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFFFFF;border-radius:16px">
                  <tr>
                    <td align="center" style="padding:24px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:38px;line-height:44px;letter-spacing:12px;font-weight:600;color:#2B2724">{{ .Token }}</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:0 4px">
                <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:19px;color:#A39A92">
                  O código vale por 1 hora. Se você não pediu um agendamento, é só ignorar este e-mail.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:28px 8px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#A39A92">Gabi Marqui Nail Designer</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
